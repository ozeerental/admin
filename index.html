<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Ozee Rentals</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Barlow",sans-serif;background:#04090F;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;}
.login-box{background:rgba(255,255,255,.04);border:1px solid rgba(245,166,35,.2);padding:3rem;width:100%;max-width:420px;}
.login-logo{text-align:center;margin-bottom:2.5rem;}
.login-logo img{height:70px;filter:brightness(0) invert(1);}
.login-logo p{color:rgba(255,255,255,.4);font-size:.75rem;letter-spacing:3px;text-transform:uppercase;margin-top:.75rem;}
.login-title{font-family:"Barlow Condensed",sans-serif;font-size:1.8rem;font-weight:900;text-transform:uppercase;letter-spacing:1px;text-align:center;margin-bottom:2rem;}
.login-title span{color:#F5A623;}
label{display:block;font-size:.78rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:.5rem;}
input{width:100%;padding:.9rem;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:1rem;font-family:"Barlow",sans-serif;margin-bottom:1.5rem;border-radius:2px;}
input:focus{outline:none;border-color:#F5A623;}
.login-btn{width:100%;padding:1.1rem;background:linear-gradient(135deg,#F5A623,#D4880A);border:none;color:#000;font-family:"Barlow Condensed",sans-serif;font-size:1.2rem;font-weight:900;letter-spacing:2px;text-transform:uppercase;cursor:pointer;clip-path:polygon(10px 0%,100% 0%,calc(100% - 10px) 100%,0% 100%);transition:all .3s;}
.login-btn:hover{box-shadow:0 8px 30px rgba(245,166,35,.5);}
.error{background:rgba(220,53,69,.2);border:1px solid rgba(220,53,69,.4);color:#f87171;padding:.75rem 1rem;font-size:.88rem;margin-bottom:1rem;display:none;border-radius:2px;}
.back-link{display:block;text-align:center;margin-top:1.5rem;color:rgba(255,255,255,.3);text-decoration:none;font-size:.8rem;letter-spacing:1px;text-transform:uppercase;transition:color .2s;}
.back-link:hover{color:rgba(255,255,255,.6);}
</style>
</head>
<body>
<div class="login-box">
  <div class="login-logo">
    <img src="../logo.jpeg" alt="Ozee Rentals">
    <p>Admin Portal</p>
  </div>
  <h2 class="login-title">Admin <span>Login</span></h2>
  <div class="error" id="errMsg">Invalid email or password. Please try again.</div>
  <form id="loginForm">
    <label>Email Address</label>
    <input type="email" id="loginEmail" required placeholder="omer@ozeerentals.com.au" autocomplete="email">
    <label>Password</label>
    <input type="password" id="loginPwd" required placeholder="••••••••" autocomplete="current-password">
    <button type="submit" class="login-btn">Sign In →</button>
  </form>
  <a href="../home.html" class="back-link">← Back to Website</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://tbhqamcuewycaqertpba.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRiaHFhbWN1ZXd5Y2FxZXJ0cGJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2NjA1OTQsImV4cCI6MjA5MzIzNjU5NH0.EPUMyCFVLpCn2omxMtDOASANEz4vAqECxs6Y2_hs96U';
window._sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
</script>
<script>
// Check if already logged in
async function checkSession(){
  const {data:{session}} = await window._sb.auth.getSession();
  if(session) window.location.href = 'dashboard.html';
}
checkSession();

document.getElementById('loginForm').addEventListener('submit', async(e)=>{
  e.preventDefault();
  const email = document.getElementById('loginEmail').value;
  const pwd = document.getElementById('loginPwd').value;
  const err = document.getElementById('errMsg');
  err.style.display = 'none';

  const {error} = await window._sb.auth.signInWithPassword({email, password:pwd});
  if(error){
    err.style.display = 'block';
  } else {
    window.location.href = 'dashboard.html';
  }
});
</script>
</body>
</html>
